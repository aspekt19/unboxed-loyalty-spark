name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Docs / MCP tool-count drift
        run: npm run check:docs

      - name: REST list output OpenAPI contract
        run: npm run test:rest-list-contract

      - name: Frontend unit tests (vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          # Public anon fallbacks also exist in vite.config.ts; CI still sets them explicitly.
          VITE_SUPABASE_URL: https://bzxmejzssxjazswgwqqs.supabase.co
          VITE_SUPABASE_PROJECT_ID: bzxmejzssxjazswgwqqs
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6eG1lanpzc3hqYXpzd2d3cXFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MDI4NjcsImV4cCI6MjA3NjI3ODg2N30.U10RsJRxIm3zPWcJPHpHuKf0X6FGO6P1bj4c21PN42o

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    # Advisory only: upstream advisories appear/disappear outside our control,
    # so this job reports but never fails the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: High/critical vulnerabilities in production deps (report)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Full audit report (report)
        run: npm audit || true

  deno-shared:
    name: Deno _shared unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run _shared Deno tests
        run: deno test --no-check --allow-env --allow-read --allow-net --node-modules-dir=auto supabase/functions/_shared/

      - name: Typecheck edge functions
        run: deno check --config supabase/functions/deno.json --node-modules-dir=auto supabase/functions/*/index.ts supabase/functions/_shared/*.ts

  e2e:
    name: Playwright E2E (public pages)
    runs-on: ubuntu-latest
    # Marketing-copy smoke tests: informative, must never block a push.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: "true"
          VITE_SUPABASE_URL: https://bzxmejzssxjazswgwqqs.supabase.co
          VITE_SUPABASE_PROJECT_ID: bzxmejzssxjazswgwqqs
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6eG1lanpzc3hqYXpzd2d3cXFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3MDI4NjcsImV4cCI6MjA3NjI3ODg2N30.U10RsJRxIm3zPWcJPHpHuKf0X6FGO6P1bj4c21PN42o

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
