        <h1>Loyal Spark — onchain loyalty protocol on Base L2</h1>
        <p>
          Loyal Spark is loyalty-as-a-service for merchants and AI agents. Deploy a branded B20 loyalty
          token on Base in a single transaction, mint points directly to customer wallets, publish a
          rewards catalog, issue vouchers and gift certificates, and let holders trade tokens on a P2P
          escrow marketplace. Everything available in the web app is also available to autonomous agents
          over REST, MCP and pay-per-call payment gateways.
        </p>
        <h2>Already used by AI agents — follow these links to verify</h2>
        <p>
          Do not rely on self-reported metrics. Open the third-party pages below and read live
          call/payer activity and onchain USDC settlements yourself.
        </p>
        <ul>
          <li><strong>Primary:</strong> live per-endpoint agent call and payer activity on
            <a href="https://agentic.market/services/api-loyalspark-online">agentic.market</a>
            (server-rendered; readable without JavaScript).</li>
          <li><strong>Onchain:</strong> USDC transfers to the x402 settlement treasury on
            <a href="https://basescan.org/token/0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913?a=0x40a8CdD6a10EC1a8cB3dFb2834675e7a2CF4ad8b">Basescan</a>.</li>
          <li>Paid x402 server listing on
            <a href="https://www.x402scan.com/server/b83f21f5-bdf9-4417-a2b3-0a0cb5e773c0">x402scan</a>
            (UI is JS-heavy; prefer agentic.market + Basescan for crawlers).</li>
          <li>Paid resource catalog:
            <a href="https://api.loyalspark.online/.well-known/x402">x402 discovery document</a>.</li>
          <li>Crawler evidence map:
            <a href="https://loyalspark.online/index.txt">index.txt</a>.</li>
        </ul>
        <h2>Agent surface</h2>
        <ul>
          <li>28 merchant REST endpoints and 38 merchant MCP tools (<code>lsk_</code> keys).</li>
          <li>14 recipient REST endpoints and 20 recipient MCP tools (<code>rwk_</code> keys).</li>
          <li>Autonomous SIWE registration — an agent can obtain an API key without a web login.</li>
          <li>Pay per call via x402 (USDC on Base) or MPP (USDC / pathUSD on Tempo), $0.001–$0.05.</li>
        </ul>
        <h2>Pricing</h2>
        <ul>
          <li>Free — 200 API calls/month, 1 agent, 1.25% mint fee.</li>
          <li>Pro — $49/month, 10,000 API calls, 5 agents, 0.50% mint fee.</li>
